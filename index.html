<style>

  .scaleBtn.active { border-color:#00B388; background:#e8f5ef; color:#00B388; }
  .scaleNum { font-size:16px; font-weight:700; }
  .scaleLbl { font-size:9.5px; text-align:center; line-height:1.15; }

  textarea { width:100%; font-family:inherit; font-size:14.5px; line-height:1.7; color:#1f2d3d; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px; min-height:96px; resize:vertical; }

  .voice { border-left:3px solid #00B388; background:#f8fafc; border-radius:0 10px 10px 0; padding:12px 14px; margin-bottom:10px; font-size:14px; line-height:1.75; color:#334155; }
  .voiceMeta { font-size:11px; color:#94a3b8; margin-bottom:4px; }
  .protected { padding:24px; text-align:center; color:#94a3b8; font-size:13.5px; line-height:1.8; }
  .legend { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12px; color:#64748b; }
  .legendBar { width:120px; height:8px; border-radius:4px; background:linear-gradient(90deg,#ef4444,#f59e0b,#00B388); }
  .loginBox { max-width:380px; margin:60px auto; }
</style>

<body>
<header>
  <div class="brand">
    <img class="brandLogo" id="brandLogo" alt="木の和ホールディングス"
         src="https://kinowahd.jp/wp/wp-content/uploads/2026/02/logo_yoko-1.png"
         onerror="this.outerHTML='<span class=\'brandFallback\'>KINOWA Holdings</span>'">
    <span class="brandDiv"></span>
    <div>
      <div class="brandName" id="brandName">内部委託 負担軽減確認アンケート</div>
      <div class="brandSub">医療連携チーム</div>
    </div>
  </div>
  <nav>
    <button class="tab" id="tabSurvey" onclick="setView('survey')">回答する</button>
    <button class="tab" id="tabAdmin" onclick="setView('admin')">集計</button>
  </nav>
</header>
<main id="main"></main>
<footer>回答は匿名で集計されます。個人が特定される情報は取得していません。</footer>

<script>
/* ============================================================
   設定（ここだけ書き替えれば他店舗・他テーマでも使えます）
   ============================================================ */

const API_URL = "https://script.google.com/macros/s/AKfycbyIl10ZACuZP1W_WxOTR2iDCmlWGczc9TTddJGppY78Q-XDqvB_VduBOX5olQtzIDC-/exec";
const USE_REMOTE = API_URL && !API_URL.startsWith("PASTE_");

const ADMIN_PASSWORD = "kinowa1001";

// ロゴ。自前で同梱する場合は "logo.png" のような相対パスに変更（HTML冒頭のimg srcも同じ値に）
const LOGO_URL = "https://kinowahd.jp/wp/wp-content/uploads/2026/02/logo_yoko-1.png";

const CONFIG = {
  title: "内部委託 負担軽減確認アンケート",
  intro: "内部委託業務が現場の負担軽減につながっているかを確認するための調査です。回答は匿名で、氏名やメールアドレスは取得しません。所要時間は3分程度です。"
};

// 対象店舗。1つだけにすると店舗選択欄は表示されず、その店舗に固定されます
const STORES = ["ケアの木", "くりの木", "ゆずの木", "ほしの木", "そらの木", "さくらの木", "お茶の木", "はれの木", "にじの木", "サン薬局", "つばくろ"];

// 店舗ごとの対象人数（回答率の分母）。不明な店舗は未記入で構いません
const TARGETS = { "くりの木": 7 };

const MIN_N = 3; // この人数未満は集計を表示しない(個人特定の防止)
let minN = MIN_N;

// 設問グループ（素案は分類なしのため1つだけ。回答画面には見出しを出さない）
const BLOCKS = [
  { key:"Q", name:"全体" }
];

// 設問（素案の設問1〜11に準拠。文言・並び順は素案どおり）
// reverse:true = 「そう思う」ほど評価が悪い設問（集計時のみ反転。回答画面の見た目は他と同じ）
// unknown:true = 「わからない・関わっていない」を選べる
const QUESTIONS = [
  { id:"Q1",  block:"Q", type:"scale", text:"医療連携チームという部門が社内にあると知っている", required:true },
  { id:"Q2",  block:"Q", type:"scale", text:"内部委託業務がどのような目的で動いているか知っている", required:true },
  { id:"Q3",  block:"Q", type:"scale", text:"内部委託業務により、納品された予製は満足する仕上がりである", required:true, unknown:true },
  { id:"Q4",  block:"Q", type:"scale", text:"依頼から納品までに要する期間に満足している", required:true, unknown:true },
  { id:"Q5",  block:"Q", type:"scale", text:"委託後に、修正・やり直し・追加対応が発生することがある", required:true, unknown:true, reverse:true },
  { id:"Q6",  block:"Q", type:"scale", text:"内部委託に伴う確認や連絡が、新たな手間になっている", required:true, unknown:true, reverse:true },
  { id:"Q7",  block:"Q", type:"scale", text:"内部委託業務が始まって業務負担が軽減したと実感できる", required:true },
  { id:"Q8",  block:"Q", type:"scale", text:"日昇ガーデン以外の施設予製も内部委託を行いたいと考えている", required:true },
  { id:"Q9",  block:"Q", type:"scale", text:"患者対応や施設対応など、本来優先したい業務に集中しやすくなった", required:true },
  { id:"Q10", block:"Q", type:"scale", text:"内部委託業務を依頼してから新しい業務・今までできなかった業務へ取り組むことができる", required:true },
  { id:"Q11", block:"Q", type:"text",  text:"10で答えた業務について具体的に記述してください", required:false }
];

const SCALE = [
  { v:1, label:"全くそうは思わない" },
  { v:2, label:"あまりそう思わない" },
  { v:3, label:"どちらでもない" },
  { v:4, label:"ややそう思う" },
  { v:5, label:"強くそう思う" }
];
const SMAX = 5;
const UNKNOWN = "わからない";
const ALL = "__all__";

/* ============================================================
   実施月
   ============================================================ */

function currentPeriod(){
  const now = new Date();
  return now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
}

// 回答者が選べる実施月：当月＋過去11ヶ月（新しい順）。初期値は当月
function periodOptions(){
  const now = new Date();
  const out = [];
  for(let i = 0; i < 12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push(d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"));
  }
  return out;
}

function formatPeriod(p){
  const m = String(p).match(/^(\d{4})-(\d{1,2})/);
  return m ? (m[1] + "年" + Number(m[2]) + "月") : String(p);
}

/* ============================================================
   通信
   ============================================================ */

let responses = [];
let dataLoading = false;
let dataLoadError = null;

async function loadResponses(){
  if(!USE_REMOTE){
    try { responses = JSON.parse(localStorage.getItem("naibu_itaku_survey_v1") || "[]"); }
    catch(e){ responses = []; }
    render();
    return;
  }
  dataLoading = true; dataLoadError = null; render();
  try {
    const res = await fetch(API_URL + "?action=all", { method:"GET" });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "unknown");
    responses = Array.isArray(data.responses) ? data.responses : [];
  } catch(err){
    dataLoadError = String(err);
    responses = [];
  } finally {
    dataLoading = false;
    render();
  }
}

async function submitResponse(rec){
  if(!USE_REMOTE){
    responses.push(rec);
    localStorage.setItem("naibu_itaku_survey_v1", JSON.stringify(responses));
    return true;
  }
  try {
    // CORS回避のためContent-Typeはあえて指定しない(text/plain扱いになりプリフライト回避)
    const res = await fetch(API_URL, { method:"POST", body: JSON.stringify(rec) });
    const data = await res.json();
    if(data.ok) return true;
    alert("送信に失敗しました: " + (data.error || "unknown"));
    return false;
  } catch(err){
    alert("送信に失敗しました: " + String(err));
    return false;
  }
}

/* ============================================================
   状態
   ============================================================ */

let view = "survey";
let isAdminMode = false;
let dashPeriod = null;
let dashStore = ALL;
let surveyState = {
  store: STORES.length === 1 ? STORES[0] : "",
  period: currentPeriod(),
  answers: {},
  done: false,
  sending: false,
  showErrors: false
};

function setView(v){ view = v; render(); window.scrollTo(0,0); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   スコア計算
   ============================================================ */

function adjusted(q, raw){
  if(raw === UNKNOWN || raw === undefined || raw === null || raw === "") return null;
  const n = Number(raw);
  if(!n || n < 1 || n > SMAX) return null;
  return q.reverse ? (SMAX + 1 - n) : n;
}
function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function scoreColor(v){ if(v >= 3.8) return "#00B388"; if(v >= 3.0) return "#d97706"; return "#dc2626"; }
function scoreLabel(v){ if(v >= 3.8) return "良好"; if(v >= 3.0) return "要観察"; return "要介入"; }

// 1(赤)→5(緑)のセル色
function cellColor(v){
  if(v === null || v === undefined) return "#f8fafc";
  const t = Math.max(0, Math.min(1, (v - 1) / (SMAX - 1)));
  const r = Math.round(239 - t*(239-31));
  const g = Math.round(68 + t*(157-68));
  const b = Math.round(68 + t*(107-68));
  return `rgba(${r},${g},${b},0.16)`;
}

function condMet(cond, answers){
  if(!cond) return true;
  const raw = answers[cond.id];
  if(raw === UNKNOWN || raw === undefined || raw === null || raw === "") return false;
  const a = Number(raw);
  if(isNaN(a)) return false;
  if(cond.op === ">=") return a >= cond.v;
  if(cond.op === "<=") return a <= cond.v;
  if(cond.op === ">")  return a >  cond.v;
  if(cond.op === "<")  return a <  cond.v;
  return a === cond.v;
}

function overallStats(recs){
  const qs = QUESTIONS.filter(q => q.type === "scale");
  const vals = [];
  recs.forEach(r => qs.forEach(q => {
    const v = adjusted(q, (r.answers||{})[q.id]);
    if(v !== null) vals.push(v);
  }));
  const pos = vals.filter(v => v >= 4).length;
  return { count: qs.length, mean: mean(vals), positive: vals.length ? pos/vals.length : null, n: vals.length };
}

function questionStats(recs, q){
  const dist = new Array(SMAX).fill(0);
  let unknown = 0;
  const plain = [], adj = [];
  recs.forEach(r => {
    const raw = (r.answers||{})[q.id];
    if(raw === UNKNOWN){ unknown++; return; }
    const n = Number(raw);
    if(!n || n < 1 || n > SMAX) return;
    dist[n-1]++;
    plain.push(n);
    adj.push(q.reverse ? (SMAX+1-n) : n);
  });
  const answered = plain.length + unknown;
  return {
    dist, unknown,
    unknownRate: answered ? unknown/answered : null,
    meanPlain: mean(plain),
    meanAdj: mean(adj),
    positive: adj.length ? adj.filter(v=>v>=4).length/adj.length : null
  };
}

function unknownRateOf(recs){
  const qs = QUESTIONS.filter(q => q.type === "scale" && q.unknown);
  let unknown = 0, total = 0;
  recs.forEach(r => qs.forEach(q => {
    const raw = (r.answers||{})[q.id];
    if(raw === undefined || raw === null || raw === "") return;
    total++;
    if(raw === UNKNOWN) unknown++;
  }));
  return total ? unknown/total : null;
}

function targetOf(store, recs){
  if(store === ALL){
    const stores = [...new Set(recs.map(r => r.store).filter(Boolean))];
    const vals = stores.map(s => TARGETS[s]).filter(v => v);
    return (stores.length && vals.length === stores.length) ? vals.reduce((a,b)=>a+b,0) : null;
  }
  return TARGETS[store] || null;
}

/* ============================================================
   回答画面
   ============================================================ */

function surveyHtml(){
  if(surveyState.done){
    return `<div class="thanks">
      <div class="checkMark">✓</div>
      <h2>送信しました</h2>
      <p class="lead" style="margin-top:10px">ご協力ありがとうございました。<br>この画面は閉じていただいて構いません。</p>
    </div>`;
  }

  const visible = QUESTIONS.filter(q => condMet(q.cond, surveyState.answers));
  const requiredVisible = visible.filter(q => q.required);
  const answeredCount = requiredVisible.filter(q => {
    const v = surveyState.answers[q.id];
    return v !== undefined && v !== null && String(v) !== "";
  }).length;
  let missing = requiredVisible.length - answeredCount;
  if(!surveyState.store) missing += 1;

  const storeInvalid = surveyState.showErrors && !surveyState.store;
  const storeField = STORES.length > 1 ? `
    <div class="selField">
      <span class="selLabel">店舗<span class="reqTag">必須</span></span>
      <select onchange="pickStore(this.value)">
        <option value="">選択してください</option>
        ${STORES.map(s => `<option value="${escapeHtml(s)}" ${surveyState.store===s?"selected":""}>${escapeHtml(s)}</option>`).join("")}
      </select>
    </div>` : "";
  const periodField = `
    <div class="selField">
      <span class="selLabel">実施月</span>
      <select onchange="pickPeriod(this.value)">
        ${periodOptions().map(p => `<option value="${p}" ${surveyState.period===p?"selected":""}>${formatPeriod(p)}</option>`).join("")}
      </select>
    </div>`;

  const headCard = `<div class="qCard ${storeInvalid ? "invalid" : ""}" id="card-head">
    <div class="qNum">はじめに</div>
    <div class="qText">ご所属と、回答対象の月を確認してください。</div>
    <div class="selRow">${storeField}${periodField}</div>
  </div>`;

  const body = visible.map(q => questionCardHtml(q)).join("");

  const btn = surveyState.sending
    ? `<button class="disabledBtn">送信しています…</button>`
    : `<button class="primaryBtn" onclick="handleSubmit()">回答を送信する</button>`;

  return `
    <h1>${escapeHtml(CONFIG.title)}</h1>
    <p class="lead">${escapeHtml(CONFIG.intro)}</p>
    <div class="metaChips">
      <span class="chip">匿名回答</span>
      <span class="chip">所要時間 約3分</span>
      <span class="chip">全${QUESTIONS.length}問</span>
    </div>
    ${headCard}
    ${body}
    <div class="submitRow">
      ${btn}
      <span class="${surveyState.showErrors && missing ? "errText" : "scoreTag"}">
        ${missing ? `未回答 ${missing}件` : "すべて回答済みです"}
      </span>
    </div>`;
}

function questionCardHtml(q){
  const val = surveyState.answers[q.id];
  const invalid = surveyState.showErrors && q.required && (val === undefined || val === null || String(val) === "");
  const num = QUESTIONS.filter(x => x.type === "scale" || x.type === "text").indexOf(q) + 1;
  const tag = q.required ? "" : `<span class="optTag">任意</span>`;

  let control = "";
  if(q.type === "scale"){
    const btns = SCALE.map(s => `
      <button class="scaleBtn ${String(val)===String(s.v) ? "active" : ""}" onclick="pick('${q.id}',${s.v})">
        <span class="scaleNum">${s.v}</span>
        <span class="scaleLbl">${s.label}</span>
      </button>`).join("");
    control = `<div class="scaleRow">${btns}</div>
      <div class="scaleEnds"><span>${SCALE[0].label}</span><span>${SCALE[SMAX-1].label}</span></div>`;
    if(q.unknown){
      control += `<div class="unknownRow">
        <button class="unknownBtn ${val===UNKNOWN ? "active" : ""}" onclick="pick('${q.id}','${UNKNOWN}')">わからない・関わっていない</button>
      </div>`;
    }
  } else {
    control = `<textarea id="ta-${q.id}" oninput="typeText('${q.id}', this.value)" placeholder="自由にお書きください">${val ? escapeHtml(val) : ""}</textarea>`;
  }

  return `<div class="qCard ${invalid ? "invalid" : ""}" id="card-${q.id}">
    <div class="qNum">設問${num}${tag}</div>
    <div class="qText">${escapeHtml(q.text)}</div>
    ${control}
  </div>`;
}

function pickStore(v){ surveyState.store = v; render(); }
function pickPeriod(v){ surveyState.period = v; }

function pick(id, v){
  surveyState.answers[id] = v;
  QUESTIONS.forEach(q => {
    if(q.cond && !condMet(q.cond, surveyState.answers)) delete surveyState.answers[q.id];
  });
  render();
}

function typeText(id, v){ surveyState.answers[id] = v; }

async function handleSubmit(){
  if(surveyState.sending || surveyState.done) return; // 二重送信の防止
  if(!surveyState.store){
    surveyState.showErrors = true; render();
    const el = document.getElementById("card-head");
    if(el) el.scrollIntoView({ block:"center" });
    return;
  }
  const visible = QUESTIONS.filter(q => condMet(q.cond, surveyState.answers));
  const missing = visible.filter(q => {
    if(!q.required) return false;
    const v = surveyState.answers[q.id];
    return v === undefined || v === null || String(v) === "";
  });
  if(missing.length){
    surveyState.showErrors = true; render();
    const el = document.getElementById("card-" + missing[0].id);
    if(el) el.scrollIntoView({ block:"center" });
    return;
  }

  surveyState.sending = true; render();
  const rec = {
    store: surveyState.store,
    period: surveyState.period || currentPeriod(),
    ts: Date.now(),
    answers: surveyState.answers
  };
  const ok = await submitResponse(rec);
  surveyState.sending = false;
  if(ok) surveyState.done = true;
  render();
  window.scrollTo(0,0);
}

/* ============================================================
   集計画面
   ============================================================ */

function loginHtml(){
  return `<div class="loginBox panel">
    <h3>集計を表示</h3>
    <p class="lead" style="font-size:13.5px;margin-bottom:14px">管理者用パスワードを入力してください。</p>
    <input type="password" id="pw" placeholder="パスワード" onkeydown="if(event.key==='Enter')tryLogin()">
    <div style="margin-top:14px"><button class="primaryBtn" onclick="tryLogin()">表示する</button></div>
  </div>`;
}

function tryLogin(){
  const v = document.getElementById("pw").value;
  if(v === ADMIN_PASSWORD){ isAdminMode = true; render(); }
  else alert("パスワードが違います。");
}

function dashboardHtml(){
  if(dataLoading) return `<div class="empty">読み込み中です…</div>`;
  if(dataLoadError) return `<div class="empty">データを取得できませんでした。<br>${escapeHtml(dataLoadError)}<br><br><button class="ghostBtn" onclick="loadResponses()">再読み込み</button></div>`;
  if(!responses.length) return `<div class="empty">まだ回答がありません。</div>`;

  const periods = [...new Set(responses.map(r => r.period).filter(Boolean))].sort().reverse();
  if(!dashPeriod || periods.indexOf(dashPeriod) === -1) dashPeriod = periods[0];
  const periodRecs = responses.filter(r => r.period === dashPeriod);
  const storesInData = [...new Set(periodRecs.map(r => r.store).filter(Boolean))]
    .sort((a,b) => {
      const ia = STORES.indexOf(a), ib = STORES.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
  if(dashStore !== ALL && storesInData.indexOf(dashStore) === -1) dashStore = ALL;
  const recs = dashStore === ALL ? periodRecs : periodRecs.filter(r => r.store === dashStore);
  const n = recs.length;
  const scopeName = dashStore === ALL ? "全店舗" : dashStore;

  const head = `<div class="dashHead">
    <h2>集計｜${formatPeriod(dashPeriod)}・${escapeHtml(scopeName)}</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select onchange="dashPeriod=this.value;render()">
        ${periods.map(p => `<option value="${p}" ${p===dashPeriod?"selected":""}>${formatPeriod(p)}</option>`).join("")}
      </select>
      <select onchange="dashStore=this.value;render()">
        <option value="${ALL}" ${dashStore===ALL?"selected":""}>全店舗</option>
        ${storesInData.map(s => `<option value="${escapeHtml(s)}" ${dashStore===s?"selected":""}>${escapeHtml(s)}</option>`).join("")}
      </select>
      <select onchange="minN=Number(this.value);render()">
        ${[1,3,4].map(v => `<option value="${v}" ${v===minN?"selected":""}>表示下限 ${v}人</option>`).join("")}
      </select>
      <button class="ghostBtn" onclick="exportCsv()">CSV出力</button>
      <button class="ghostBtn" onclick="loadResponses()">再読み込み</button>
    </div>
  </div>`;

  if(n < minN){
    return head + `<div class="panel"><div class="protected">
      この範囲の回答は ${n}件です。表示下限（${minN}人）に達していないため、個人が特定されないよう集計を非表示にしています。<br>
      店舗を「全店舗」に切り替えるか、表示下限を変更してください。
    </div></div>` + storeSummaryHtml(periodRecs, storesInData) + trendHtml(periods);
  }

  const target = targetOf(dashStore, recs);
  const rate = target ? Math.round(n / target * 1000)/10 : null;
  const ov = overallStats(recs);
  const uk = unknownRateOf(recs);
  const stats = `<div class="statRow">
    <div class="stat"><div class="statValue">${n}</div><div class="statLabel">回答数</div></div>
    <div class="stat"><div class="statValue">${rate !== null ? rate + "%" : "—"}</div><div class="statLabel">回答率${target ? `（対象${target}名）` : ""}</div></div>
    <div class="stat"><div class="statValue" style="color:${ov.mean !== null ? scoreColor(ov.mean) : "#94a3b8"}">${ov.mean !== null ? ov.mean.toFixed(2) : "—"}</div><div class="statLabel">全体平均 / 5${ov.mean !== null ? "（" + scoreLabel(ov.mean) + "）" : ""}</div></div>
    <div class="stat"><div class="statValue">${ov.positive !== null ? Math.round(ov.positive*100) + "%" : "—"}</div><div class="statLabel">肯定率（4・5の割合）</div></div>
    <div class="stat"><div class="statValue">${uk !== null ? Math.round(uk*100) + "%" : "—"}</div><div class="statLabel">わからない率</div></div>
  </div>`;

  const distColors = ["#dc2626","#f97316","#cbd5e1","#5eead4","#00B388"];
  const qRows = QUESTIONS.filter(q => q.type === "scale").map((q, i) => {
    const s = questionStats(recs, q);
    const total = s.dist.reduce((a,b)=>a+b,0);
    const bar = total
      ? s.dist.map((c,j) => c ? `<div style="width:${c/total*100}%;background:${distColors[j]}" title="${j+1}: ${c}人"></div>` : "").join("")
      : "";
    return `<tr>
      <td class="left">${i+1}${q.reverse ? `<span class="revTag">逆転</span>` : ""}</td>
      <td class="qtext">${escapeHtml(q.text)}</td>
      <td><div class="distBar">${bar}</div></td>
      <td>${s.meanPlain !== null ? s.meanPlain.toFixed(2) : "—"}</td>
      <td>${s.meanAdj !== null ? s.meanAdj.toFixed(2) : "—"}</td>
      <td>${s.positive !== null ? Math.round(s.positive*100) + "%" : "—"}</td>
      <td>${q.unknown ? s.unknown + (s.unknownRate ? `（${Math.round(s.unknownRate*100)}%）` : "") : "—"}</td>
    </tr>`;
  }).join("");

  const qTable = `<div class="panel">
    <div class="panelHead"><h3 style="margin:0">設問別</h3><span class="scoreTag">分布の色は 1(赤)→5(緑)</span></div>
    <div class="tableWrap"><table>
      <thead><tr>
        <th class="left">設問</th><th class="left">内容</th><th>回答分布</th>
        <th>平均<br>(素点)</th><th>平均<br>(評価方向)</th><th>肯定率</th><th>わからない</th>
      </tr></thead>
      <tbody>${qRows}</tbody>
    </table></div>
    <div class="note" style="margin-top:16px;border:none;padding:0">
      設問5・6は「そう思う」ほど評価が悪いため、評価方向の平均では反転しています。「わからない」は平均から除外しており、この値が高い設問は評価が低いのではなく、内部委託に関わっていない人が多いと読みます。
    </div>
  </div>`;

  const textQs = QUESTIONS.filter(q => q.type === "text");
  let voices = "";
  textQs.forEach(q => {
    recs.forEach(r => {
      const v = String((r.answers||{})[q.id] || "").trim();
      if(v){
        const label = dashStore === ALL && r.store ? `${escapeHtml(r.store)}` : "自由記述";
        voices += `<div class="voice"><div class="voiceMeta">${label}｜${escapeHtml(q.text)}</div>${escapeHtml(v)}</div>`;
      }
    });
  });
  const voicePanel = `<div class="panel">
    <h3>自由記述</h3>
    ${voices || `<div class="protected">記述回答はまだありません。</div>`}
  </div>`;

  const reading = `<div class="note">
    <strong>読み方</strong>
    <p>1店舗あたりの回答が10件未満だと、1人の回答で平均が0.2前後動きます。平均の小さな差ではなく、回答の分布（1〜2を選んだ人が何人いるか）と自由記述を根拠に判断してください。</p>
  </div>`;

  return head + stats + qTable + storeSummaryHtml(periodRecs, storesInData)
       + storeMatrixHtml(periodRecs, storesInData) + voicePanel + trendHtml(periods) + reading;
}

// 店舗別サマリ
function storeSummaryHtml(periodRecs, storesInData){
  if(!storesInData.length) return "";
  const rows = storesInData.map(s => {
    const recs = periodRecs.filter(r => r.store === s);
    const target = TARGETS[s] || null;
    if(recs.length < minN){
      return `<tr><td class="storeName">${escapeHtml(s)}</td><td>${recs.length}${target ? ` / ${target}` : ""}</td><td colspan="3" style="color:#94a3b8">表示下限（${minN}人）未満</td></tr>`;
    }
    const ov = overallStats(recs);
    const uk = unknownRateOf(recs);
    return `<tr>
      <td class="storeName">${escapeHtml(s)}</td>
      <td>${recs.length}${target ? ` / ${target}` : ""}</td>
      <td style="background:${cellColor(ov.mean)}">${ov.mean !== null ? ov.mean.toFixed(2) : "—"}</td>
      <td>${ov.positive !== null ? Math.round(ov.positive*100) + "%" : "—"}</td>
      <td>${uk !== null ? Math.round(uk*100) + "%" : "—"}</td>
    </tr>`;
  }).join("");

  const all = overallStats(periodRecs);
  const allUk = unknownRateOf(periodRecs);
  const totalRow = storesInData.length > 1 ? `<tr class="totalRow">
      <td class="storeName">全店舗</td>
      <td>${periodRecs.length}</td>
      <td>${all.mean !== null ? all.mean.toFixed(2) : "—"}</td>
      <td>${all.positive !== null ? Math.round(all.positive*100) + "%" : "—"}</td>
      <td>${allUk !== null ? Math.round(allUk*100) + "%" : "—"}</td>
    </tr>` : "";

  return `<div class="panel">
    <div class="panelHead"><h3 style="margin:0">店舗別サマリ</h3><span class="scoreTag">この月の全店舗が対象（上の店舗フィルタの影響を受けません）</span></div>
    <div class="tableWrap"><table>
      <thead><tr><th class="left">店舗</th><th>回答数</th><th>全体平均</th><th>肯定率</th><th>わからない率</th></tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table></div>
  </div>`;
}

// 店舗 × 設問のマトリクス（評価方向に揃えた平均）
function storeMatrixHtml(periodRecs, storesInData){
  if(storesInData.length < 2) return "";
  const qs = QUESTIONS.filter(q => q.type === "scale");
  const rows = storesInData.map(s => {
    const recs = periodRecs.filter(r => r.store === s);
    if(recs.length < minN){
      return `<tr><td class="storeName">${escapeHtml(s)}</td><td>${recs.length}</td><td colspan="${qs.length}" style="color:#94a3b8">表示下限（${minN}人）未満</td></tr>`;
    }
    const cells = qs.map(q => {
      const m = questionStats(recs, q).meanAdj;
      return `<td style="background:${cellColor(m)}">${m !== null ? m.toFixed(1) : "—"}</td>`;
    }).join("");
    return `<tr><td class="storeName">${escapeHtml(s)}</td><td>${recs.length}</td>${cells}</tr>`;
  }).join("");

  return `<div class="panel">
    <div class="panelHead"><h3 style="margin:0">店舗 × 設問</h3><span class="scoreTag">この月の全店舗が対象。数字は評価方向に揃えた平均（設問5・6は反転済み）</span></div>
    <div class="tableWrap"><table>
      <thead><tr><th class="left">店舗</th><th>n</th>${qs.map((q,i)=>`<th title="${escapeHtml(q.text)}">${i+1}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend"><span>低い</span><span class="legendBar"></span><span>高い</span><span style="margin-left:10px">列番号は設問番号（見出しにカーソルを当てると設問文が出ます）</span></div>
  </div>`;
}

function trendHtml(periods){
  const asc = [...periods].sort();
  if(asc.length < 2) return "";
  const scopeName = dashStore === ALL ? "全店舗" : dashStore;
  const rows = asc.map(p => {
    const recs = responses.filter(r => r.period === p && (dashStore === ALL || r.store === dashStore));
    if(!recs.length){
      return `<tr><td class="left">${formatPeriod(p)}</td><td>0</td><td colspan="2" style="color:#94a3b8">回答なし</td></tr>`;
    }
    if(recs.length < minN){
      return `<tr><td class="left">${formatPeriod(p)}</td><td>${recs.length}</td><td colspan="2" style="color:#94a3b8">表示下限（${minN}人）未満</td></tr>`;
    }
    const ov = overallStats(recs);
    return `<tr>
      <td class="left">${formatPeriod(p)}</td>
      <td>${recs.length}</td>
      <td style="background:${cellColor(ov.mean)}">${ov.mean !== null ? ov.mean.toFixed(2) : "—"}</td>
      <td>${ov.positive !== null ? Math.round(ov.positive*100) + "%" : "—"}</td>
    </tr>`;
  }).join("");
  return `<div class="panel">
    <div class="panelHead"><h3 style="margin:0">実施月ごとの推移</h3><span class="scoreTag">対象：${escapeHtml(scopeName)}</span></div>
    <div class="tableWrap"><table>
      <thead><tr><th class="left">実施月</th><th>回答数</th><th>全体平均</th><th>肯定率</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function exportCsv(){
  const cols = ["実施月","店舗","送信日時"].concat(QUESTIONS.map((q,i) => "設問" + (i+1) + "(" + q.id + ")"));
  const lines = [cols.join(",")];
  responses.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(r => {
    const row = [r.period || "", r.store || "", r.ts ? new Date(r.ts).toLocaleString("ja-JP") : ""]
      .concat(QUESTIONS.map(q => (r.answers||{})[q.id] === undefined ? "" : String((r.answers||{})[q.id])));
    lines.push(row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "負担軽減確認アンケート_" + currentPeriod() + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============================================================
   描画
   ============================================================ */

function render(){
  const logo = document.getElementById("brandLogo");
  if(logo && logo.getAttribute("src") !== LOGO_URL) logo.setAttribute("src", LOGO_URL);
  document.getElementById("brandName").textContent = CONFIG.title;
  document.getElementById("tabSurvey").className = "tab" + (view === "survey" ? " active" : "");
  document.getElementById("tabAdmin").className = "tab" + (view === "admin" ? " active" : "");
  const main = document.getElementById("main");
  if(view === "survey"){ main.innerHTML = surveyHtml(); return; }
  main.innerHTML = isAdminMode ? dashboardHtml() : loginHtml();
}

render();
loadResponses();
</script>
